api: yes
apiAddress: 0.0.0.0:9997
apiAllowOrigin: '*'

rtsp: yes
rtspAddress: :8554

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: api
      - action: read

record: no
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
recordFormat: mpegts
recordSegmentDuration: 1h

paths:
  all:
    source: publisher









