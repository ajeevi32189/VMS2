<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>403 - Access Forbidden | VMS</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(circle at 50% 20%, #1a1a1a 0%, #000 70%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 40px;
    padding: 48px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  }
  h1.brand {
    color: #fff;
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    font-style: italic;
    margin: 0 0 4px;
    line-height: 1;
  }
  h2.sub {
    color: rgba(255,255,255,0.8);
    font-size: 1.25rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 8px;
  }
  p.tagline {
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 0.3em;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0 0 32px;
  }
  .icon-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .code {
    color: #fff;
    font-size: 3rem;
    font-weight: 900;
    margin: 0;
    letter-spacing: 0.05em;
  }
  .msg-title {
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    margin: 8px 0 8px;
  }
  .msg-body {
    color: rgba(255,255,255,0.6);
    font-size: 0.875rem;
    font-weight: 500;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  a.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    background: #fff;
    color: #000;
    font-weight: 900;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.1s;
  }
  a.back-btn:hover { background: #f0f0f0; }
  a.back-btn:active { transform: scale(0.98); }
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.2);
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.3em;
  }
  .footer span { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
  <div class="card">
    <h1 class="brand">Gyanakshi</h1>
    <h2 class="sub">Ajeevi VMS</h2>
    <p class="tagline">Secure . Connected . Sustainable</p>

    <div class="icon-wrap">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        <line x1="12" y1="14" x2="12" y2="16"></line>
      </svg>
    </div>

    <p class="code">403</p>
    <p class="msg-title">Access Forbidden</p>
    <p class="msg-body">You don't have permission to access this resource directly. This isn't a broken link — head back to the app instead.</p>

    <a href="/" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to VMS
    </a>
  </div>

  <div class="footer">Design Engineering by <span>Ajeevi Technologies</span></div>
</body>
</html>
