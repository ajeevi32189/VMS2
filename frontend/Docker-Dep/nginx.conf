# File: nginx.conf
server {
  listen 80;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (STQC Compliant) ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-XSS-Protection "1; mode=block" always;
  
  # Added Cache-Control as per STQC
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Expires "0" always;

  # --- Cross-Origin Headers (Points 3, 4, 5) ---
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;

  # --- Content Security Policy ---
  # Removed https://cdn.jsdelivr.net as mpegts is now locally bundled via npm
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https://usermanagementmsvms.gyanakshi.com https://vmscameraapi.gyanakshi.com https://vmsstreamapi.gyanakshi.com https://vmsonvifapi.gyanakshi.com https://vmsrecordingapi.gyanakshi.com https://vmsanalyticsapi.gyanakshi.com https://ticketmanagementms.ajeevi.in https://roi.gyanakshi.com https://vmsgotortc.gyanakshi.com https://faceenrollmentapi.gyanakshi.com wss://vmsstreamapi.gyanakshi.com wss://vmsgotortc.gyanakshi.com; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

  # Custom branded page for bare directory 403s (e.g. /assets/, /videos/)
  error_page 403 /403.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}